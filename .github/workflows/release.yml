name: Release

# Push a tag such as `v2.2.0` to build the CLI and GUI for every platform and
# attach the archives to a GitHub Release. Or run it manually ("Run workflow")
# on a branch with a new tag name: it builds that branch and creates the tag
# and release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v2.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tag push: build the tag. Manual run: build the selected branch.
          ref: ${{ github.event_name == 'push' && env.TAG || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="levelator-${TAG}-${{ matrix.name }}"
          dir="dist/$name"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release"
          cp "$bin/level" "$dir/"
          cp README.md LICENSE "$dir/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Wrap the GUI in a minimal (ad-hoc signed) .app bundle so it can be
            # launched from Finder.
            app="$dir/Levelator.app/Contents"
            mkdir -p "$app/MacOS"
            cp "$bin/levelator" "$app/MacOS/levelator"
            sed "s/@VERSION@/${TAG#v}/" packaging/macos/Info.plist > "$app/Info.plist"
            codesign --force --deep -s - "$dir/Levelator.app"
          else
            cp "$bin/levelator" "$dir/"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "levelator-$env:TAG-${{ matrix.name }}"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bin = "target/${{ matrix.target }}/release"
          Copy-Item "$bin/level.exe", "$bin/levelator.exe", README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Creates the tag at this commit when it doesn't exist yet.
          target_commitish: ${{ github.sha }}
          name: Levelator ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
