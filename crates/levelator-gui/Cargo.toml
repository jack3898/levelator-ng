[package]
name = "levelator"
description = "Drag-and-drop desktop Levelator for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "levelator"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
levelator-core = { path = "../levelator-core" }

[target.'cfg(target_os = "linux")'.dependencies]
# Same winit as eframe; used to pick X11 when Wayland is advertised but unusable.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
libloading = "0.8"
